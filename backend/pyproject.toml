[project]
name = "hsp-giftos-api"
version = "0.1.0"
description = "HSP GiftOS backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pyjwt>=2.9",
  "pydantic-settings>=2.4",
  "httpx>=0.28.1",
  "anthropic>=2.9.0",
  "python-multipart>=0.0.34",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
