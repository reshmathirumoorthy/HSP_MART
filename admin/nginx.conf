# Single-page app: unknown paths fall back to index.html. /api is routed by the gateway in front.
server {
  listen 80;
  root /usr/share/nginx/html;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # The Vite build has no inline scripts, so scripts are limited to this origin. Inline style attributes are used.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.shopify.com https://images.unsplash.com; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  location / { try_files $uri /index.html; }
}
