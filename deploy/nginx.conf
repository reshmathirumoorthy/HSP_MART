# Gateway: one site for the store and admin so the hsp_session cookie is first-party everywhere.
#   http://localhost         -> storefront + portals (Next.js)
#   http://admin.localhost   -> admin console (static)
#   */api/*                  -> FastAPI on both hosts
# In production terminate TLS in front (or here) and use real hostnames, e.g. hspmart.com / admin.hspmart.com.

upstream api { server api:8000; keepalive 16; }
upstream web { server web:3000; keepalive 16; }
upstream admin { server admin:80; }

server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 12m;
  location /api/ { proxy_pass http://api; include /etc/nginx/proxy_common.conf; }
  location / { proxy_pass http://web; include /etc/nginx/proxy_common.conf; }
}

server {
  listen 80;
  server_name ~^admin\.;
  client_max_body_size 12m;
  location /api/ { proxy_pass http://api; include /etc/nginx/proxy_common.conf; }
  location /images/ { proxy_pass http://web; include /etc/nginx/proxy_common.conf; }
  location / { proxy_pass http://admin; include /etc/nginx/proxy_common.conf; }
}
