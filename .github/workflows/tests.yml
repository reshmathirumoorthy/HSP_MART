name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hsp_giftos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hsp_giftos_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hsp_giftos_test
      E2E_PROD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm ci
        working-directory: admin
      - run: uv sync --project backend --frozen
      - run: npx playwright install --with-deps chromium
      # Playwright's global setup resets, migrates and seeds the test database, then the API tests reuse it.
      - name: End-to-end tests (Next.js + FastAPI + React admin, production build)
        run: npx playwright test
      - name: API tests
        working-directory: backend
        run: uv run pytest
      - name: Admin type check
        working-directory: admin
        run: npx tsc -b --noEmit
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
